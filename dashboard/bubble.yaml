# Dashboard template (not an HA Blueprint). Render entity mappings with tools/render_dashboard.py.
title: PS4 · Playtime Companion
views:
- title: PS4
  path: settings
  icon: mdi:controller-classic
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: custom:config-template-card
      entities:
      - input_datetime.ps4_weekday_start
      - input_datetime.ps4_weekday_end
      - input_number.ps4_weekday_hours
      - input_datetime.ps4_friday_start
      - input_datetime.ps4_friday_end
      - input_number.ps4_friday_hours
      - input_datetime.ps4_saturday_start
      - input_datetime.ps4_saturday_end
      - input_number.ps4_saturday_hours
      - input_datetime.ps4_voice_start
      - input_datetime.ps4_voice_end
      - input_number.ps4_warning_early
      - input_number.ps4_warning_soon
      - input_number.ps4_warning_final
      - input_boolean.ps4_friday_end_enabled
      - input_boolean.ps4_voice_enabled
      - input_number.ps4_bonus_minutes
      - input_datetime.ps4_bonus_date
      - input_boolean.ps4_manual_block
      - sensor.ps4_ftp_status
      - sensor.ps4_play_time_today
      - binary_sensor.ps4_extra_time_available
      - automation.ps4_playtime_enforcement
      variables:
      - /^(he|iw)(-|$)/i.test(this.hass.locale?.language || this.hass.language || 'en')
      card:
        type: vertical-stack
        cards:
        - type: markdown
          content: '${vars[0] ? "# 🎮 Playtime Companion\n### זמן לשחק. זמן לנוח.\n{% set p = ''friday'' if now().weekday()==4
            else ''saturday'' if now().weekday()==5 else ''weekday'' %}\n{% set cap = states({''weekday'': ''input_number.ps4_weekday_hours'',
            ''friday'': ''input_number.ps4_friday_hours'', ''saturday'': ''input_number.ps4_saturday_hours''}[p])
            | float(0) %}\n{% set cap = cap + (states(''input_number.ps4_bonus_minutes'') | float(0) / 60 if states(''input_datetime.ps4_bonus_date'')
            == now().date() | string else 0) %}\n{% set used = states(''sensor.ps4_play_time_today'') | float(0)
            %}\n{% set start = states({''weekday'': ''input_datetime.ps4_weekday_start'', ''friday'': ''input_datetime.ps4_friday_start'',
            ''saturday'': ''input_datetime.ps4_saturday_start''}[p]) %}\n{% set end = states({''weekday'': ''input_datetime.ps4_weekday_end'',
            ''friday'': ''input_datetime.ps4_friday_end'', ''saturday'': ''input_datetime.ps4_saturday_end''}[p])
            %}\n{% set unlimited = p==''friday'' and is_state(''input_boolean.ps4_friday_end_enabled'',''off'')
            %}\n**היום:** ⁦{{ start[:5] }}{{ '''' if unlimited else '' – '' ~ end[:5] }}⁩ {{ ''והלאה'' if unlimited
            else '''' }} · מכסה {{ cap | round(1) }} שעות\n\n**{{ (used * 60) | round(0) | int }} דקות נצברו** ·
            {{ ([0, (cap-used)*60] | max) | round(0) | int }} דקות במכסה נותרו\n\nמצב מנוחה באמצעות CEC · שמירה
            על GoldHEN" : "# 🎮 Playtime Companion\n### Time to play. Time to rest.\n{% set p = ''friday'' if now().weekday()==4
            else ''saturday'' if now().weekday()==5 else ''weekday'' %}\n{% set cap = states({''weekday'': ''input_number.ps4_weekday_hours'',
            ''friday'': ''input_number.ps4_friday_hours'', ''saturday'': ''input_number.ps4_saturday_hours''}[p])
            | float(0) %}\n{% set cap = cap + (states(''input_number.ps4_bonus_minutes'') | float(0) / 60 if states(''input_datetime.ps4_bonus_date'')
            == now().date() | string else 0) %}\n{% set used = states(''sensor.ps4_play_time_today'') | float(0)
            %}\n{% set start = states({''weekday'': ''input_datetime.ps4_weekday_start'', ''friday'': ''input_datetime.ps4_friday_start'',
            ''saturday'': ''input_datetime.ps4_saturday_start''}[p]) %}\n{% set end = states({''weekday'': ''input_datetime.ps4_weekday_end'',
            ''friday'': ''input_datetime.ps4_friday_end'', ''saturday'': ''input_datetime.ps4_saturday_end''}[p])
            %}\n{% set unlimited = p==''friday'' and is_state(''input_boolean.ps4_friday_end_enabled'',''off'')
            %}\n**Today:** {{ start[:5] }} {{ ''onwards'' if unlimited else ''– '' ~ end[:5] }} · quota {{ cap |
            round(1) }} hours\n\n**{{ (used * 60) | round(0) | int }} minutes used** · {{ ([0, (cap-used)*60] |
            max) | round(0) | int }} minutes of quota left\n\nRest Mode via CEC · Preserve GoldHEN"}'
          card_mod:
            style: '${vars[0] ? "ha-card { border-radius: 26px; border: 1px solid rgba(130,150,180,.16); box-shadow:
              none; }ha-card { background: linear-gradient(125deg, #172b4d, #23465c 55%, #275a58); color: #fff;
              padding: 10px 12px; } ha-markdown { direction: rtl; } ha-card { direction: rtl; text-align: right;
              } .card-header, ha-markdown { direction: rtl; text-align: right; } ha-textfield, ha-time-input, ha-date-input
              { direction: ltr; }" : "ha-card { border-radius: 26px; border: 1px solid rgba(130,150,180,.16); box-shadow:
              none; }ha-card { background: linear-gradient(125deg, #172b4d, #23465c 55%, #275a58); color: #fff;
              padding: 10px 12px; } ha-markdown { direction: ltr; } ha-card { direction: ltr; text-align: left;
              } .card-header, ha-markdown { direction: ltr; text-align: left; } ha-textfield, ha-time-input, ha-date-input
              { direction: ltr; }"}'
        - type: markdown
          content: '${vars[0] ? "{# בחירת הגדרות היום: שישי, שבת או א׳–ה׳. הערכים נערכים בלוח PS4. #}\n{% set profile
            = ''friday'' if now().weekday() == 4 else ''saturday'' if now().weekday() == 5 else ''weekday'' %}\n{%
            set start_value = states({''weekday'': ''input_datetime.ps4_weekday_start'', ''friday'': ''input_datetime.ps4_friday_start'',
            ''saturday'': ''input_datetime.ps4_saturday_start''}[profile]) %}\n{% set end_value = states({''weekday'':
            ''input_datetime.ps4_weekday_end'', ''friday'': ''input_datetime.ps4_friday_end'', ''saturday'': ''input_datetime.ps4_saturday_end''}[profile])
            %}\n{% set hours = states({''weekday'': ''input_number.ps4_weekday_hours'', ''friday'': ''input_number.ps4_friday_hours'',
            ''saturday'': ''input_number.ps4_saturday_hours''}[profile]) | float(0) %}\n{# תוספת תקפה ליום המקומי
            בלבד; אינה דוחה את שעת הסיום. #}\n{% set bonus = states(''input_number.ps4_bonus_minutes'') | float(0)
            if states(''input_datetime.ps4_bonus_date'') == now().date() | string else 0 %}\n{% set hours = hours
            + bonus / 60 %}\n{% set end_enabled = profile != ''friday'' or is_state(''input_boolean.ps4_friday_end_enabled'',''on'')
            %}\n{% set valid = start_value not in [''unknown'',''unavailable''] and end_value not in [''unknown'',''unavailable'']
            and hours > 0 %}\n{% set start = today_at(start_value) if valid else today_at(''00:00'') %}\n{% set
            end = today_at(end_value) if valid else today_at(''00:00'') %}\n{# טווח חוצה חצות אינו נתמך; ביום שישי
            ניתן לבטל שעת סיום. #}\n{% set valid = valid and (not end_enabled or end > start) %}\n{% set allowed
            = valid and now() >= start and (not end_enabled or now() < end) %}\n{% set used = states(''sensor.ps4_play_time_today'')
            | float(0) %}\n{% set quota = hours * 60 - used * 60 %}\n{% set remaining = [quota, (end-now()).total_seconds()/60]
            | min if end_enabled else quota %}\n\n{% set minutes_left = ([0, remaining] | max) | round(0, ''ceil'')
            | int %}\n{% if is_state(''input_boolean.ps4_manual_block'',''on'') %}\n## ⁦00:00⁩ · חסימה ידנית פעילה\nשחרור
            החסימה אינו עוקף את שעות המשחק והמכסה.\n{% elif not valid %}\n## ⚠️ יש לתקן את שעות המשחק\n{% elif not
            allowed %}\n## ⁦00:00⁩ · מחוץ לשעות המשחק\nתוספת למכסה אינה משנה את שעת הסיום.\n{% elif not has_value(''sensor.ps4_play_time_today'')
            %}\n## ממתין לנתוני זמן המשחק\n{% else %}\n# ⁦{{ ''%02d:%02d'' | format(minutes_left // 60, minutes_left
            % 60) }}⁩\n{{ ''עד למצב מנוחה'' if is_state(''sensor.ps4_ftp_status'',''online'') else ''יתרה זמינה
            · הקונסולה אינה פעילה ברשת'' }}\n{% endif %}\n\n**תוספת להיום: {{ bonus | int }} דקות** · המונה בשעות:דקות,
            מתעדכן כדקה.\n" : "\n{% set profile = ''friday'' if now().weekday() == 4 else ''saturday'' if now().weekday()
            == 5 else ''weekday'' %}\n{% set start_value = states({''weekday'': ''input_datetime.ps4_weekday_start'',
            ''friday'': ''input_datetime.ps4_friday_start'', ''saturday'': ''input_datetime.ps4_saturday_start''}[profile])
            %}\n{% set end_value = states({''weekday'': ''input_datetime.ps4_weekday_end'', ''friday'': ''input_datetime.ps4_friday_end'',
            ''saturday'': ''input_datetime.ps4_saturday_end''}[profile]) %}\n{% set hours = states({''weekday'':
            ''input_number.ps4_weekday_hours'', ''friday'': ''input_number.ps4_friday_hours'', ''saturday'': ''input_number.ps4_saturday_hours''}[profile])
            | float(0) %}\n\n{% set bonus = states(''input_number.ps4_bonus_minutes'') | float(0) if states(''input_datetime.ps4_bonus_date'')
            == now().date() | string else 0 %}\n{% set hours = hours + bonus / 60 %}\n{% set end_enabled = profile
            != ''friday'' or is_state(''input_boolean.ps4_friday_end_enabled'',''on'') %}\n{% set valid = start_value
            not in [''unknown'',''unavailable''] and end_value not in [''unknown'',''unavailable''] and hours >
            0 %}\n{% set start = today_at(start_value) if valid else today_at(''00:00'') %}\n{% set end = today_at(end_value)
            if valid else today_at(''00:00'') %}\n\n{% set valid = valid and (not end_enabled or end > start) %}\n{%
            set allowed = valid and now() >= start and (not end_enabled or now() < end) %}\n{% set used = states(''sensor.ps4_play_time_today'')
            | float(0) %}\n{% set quota = hours * 60 - used * 60 %}\n{% set remaining = [quota, (end-now()).total_seconds()/60]
            | min if end_enabled else quota %}\n\n{% set minutes_left = ([0, remaining] | max) | round(0, ''ceil'')
            | int %}\n{% if is_state(''input_boolean.ps4_manual_block'',''on'') %}\n## 00:00 · Manually blocked\nReleasing
            this block does not override the schedule or quota.\n{% elif not valid %}\n## ⚠️ Please correct the
            play window\n{% elif not allowed %}\n## 00:00 · Outside allowed hours\nExtra time does not extend the
            closing time.\n{% elif not has_value(''sensor.ps4_play_time_today'') %}\n## Waiting for playtime data\n{%
            else %}\n# {{ ''%02d:%02d'' | format(minutes_left // 60, minutes_left % 60) }}\n{{ ''until Rest Mode''
            if is_state(''sensor.ps4_ftp_status'',''online'') else ''Time available · console is not online'' }}\n{%
            endif %}\n\n**Today’s bonus: {{ bonus | int }} min** · Hours:minutes · updates about every minute.\n"}'
          card_mod:
            style: '${vars[0] ? "ha-card { border-radius: 26px; border: 1px solid rgba(130,150,180,.16); box-shadow:
              none; }ha-markdown { direction: rtl; } ha-card { direction: rtl; text-align: right; } .card-header,
              ha-markdown { direction: rtl; text-align: right; } ha-textfield, ha-time-input, ha-date-input { direction:
              ltr; }" : "ha-card { border-radius: 26px; border: 1px solid rgba(130,150,180,.16); box-shadow: none;
              }ha-markdown { direction: ltr; } ha-card { direction: ltr; text-align: left; } .card-header, ha-markdown
              { direction: ltr; text-align: left; } ha-textfield, ha-time-input, ha-date-input { direction: ltr;
              }"}'
        - type: conditional
          conditions:
          - condition: state
            entity: binary_sensor.ps4_extra_time_available
            state: 'on'
          card:
            type: horizontal-stack
            cards:
            - type: custom:bubble-card
              card_type: button
              button_type: name
              name: '${vars[0] ? "הוספת 15 דקות" : "+15 min"}'
              icon: mdi:timer-plus-outline
              card_layout: large
              styles: '${vars[0] ? ".bubble-button-background { opacity: 1 !important; background: #64c8ba22 !important;
                } .bubble-icon { color: #64c8ba !important; } .bubble-name { font-weight: 700; } .bubble-button-card-container,
                .bubble-separator, .bubble-header { direction: rtl; } .bubble-name-container, .bubble-name, .bubble-state
                { text-align: right; direction: rtl; unicode-bidi: plaintext; } .bubble-name { white-space: normal;
                }" : ".bubble-button-background { opacity: 1 !important; background: #64c8ba22 !important; } .bubble-icon
                { color: #64c8ba !important; } .bubble-name { font-weight: 700; } .bubble-button-card-container,
                .bubble-separator, .bubble-header { direction: ltr; } .bubble-name-container, .bubble-name, .bubble-state
                { text-align: left; direction: ltr; unicode-bidi: plaintext; } .bubble-name { white-space: normal;
                }"}'
              tap_action:
                action: call-service
                service: script.ps4_add_playtime
                service_data:
                  minutes: 15
              button_action:
                tap_action:
                  action: call-service
                  service: script.ps4_add_playtime
                  service_data:
                    minutes: 15
            - type: custom:bubble-card
              card_type: button
              button_type: name
              name: '${vars[0] ? "הוספת 30 דקות" : "+30 min"}'
              icon: mdi:timer-plus
              card_layout: large
              styles: '${vars[0] ? ".bubble-button-background { opacity: 1 !important; background: #aa9cfa22 !important;
                } .bubble-icon { color: #aa9cfa !important; } .bubble-name { font-weight: 700; } .bubble-button-card-container,
                .bubble-separator, .bubble-header { direction: rtl; } .bubble-name-container, .bubble-name, .bubble-state
                { text-align: right; direction: rtl; unicode-bidi: plaintext; } .bubble-name { white-space: normal;
                }" : ".bubble-button-background { opacity: 1 !important; background: #aa9cfa22 !important; } .bubble-icon
                { color: #aa9cfa !important; } .bubble-name { font-weight: 700; } .bubble-button-card-container,
                .bubble-separator, .bubble-header { direction: ltr; } .bubble-name-container, .bubble-name, .bubble-state
                { text-align: left; direction: ltr; unicode-bidi: plaintext; } .bubble-name { white-space: normal;
                }"}'
              tap_action:
                action: call-service
                service: script.ps4_add_playtime
                service_data:
                  minutes: 30
              button_action:
                tap_action:
                  action: call-service
                  service: script.ps4_add_playtime
                  service_data:
                    minutes: 30
        - type: conditional
          conditions:
          - condition: state
            entity: binary_sensor.ps4_extra_time_available
            state: 'off'
          - condition: state
            entity: input_boolean.ps4_manual_block
            state: 'off'
          card:
            type: custom:bubble-card
            card_type: button
            button_type: name
            name: '${vars[0] ? "חסום עכשיו" : "Block now"}'
            icon: mdi:lock-outline
            card_layout: large
            styles: '${vars[0] ? ".bubble-button-background { opacity: 1 !important; background: #db857d22 !important;
              } .bubble-icon { color: #db857d !important; } .bubble-name { font-weight: 700; } .bubble-button-card-container,
              .bubble-separator, .bubble-header { direction: rtl; } .bubble-name-container, .bubble-name, .bubble-state
              { text-align: right; direction: rtl; unicode-bidi: plaintext; } .bubble-name { white-space: normal;
              }" : ".bubble-button-background { opacity: 1 !important; background: #db857d22 !important; } .bubble-icon
              { color: #db857d !important; } .bubble-name { font-weight: 700; } .bubble-button-card-container, .bubble-separator,
              .bubble-header { direction: ltr; } .bubble-name-container, .bubble-name, .bubble-state { text-align:
              left; direction: ltr; unicode-bidi: plaintext; } .bubble-name { white-space: normal; }"}'
            tap_action:
              action: call-service
              service: script.ps4_block_playtime
            button_action:
              tap_action:
                action: call-service
                service: script.ps4_block_playtime
        - type: conditional
          conditions:
          - condition: state
            entity: input_boolean.ps4_manual_block
            state: 'on'
          card:
            type: custom:bubble-card
            card_type: button
            button_type: name
            name: '${vars[0] ? "שחרר חסימה ידנית" : "Release manual block"}'
            icon: mdi:lock-open-outline
            card_layout: large
            styles: '${vars[0] ? ".bubble-button-background { opacity: 1 !important; background: #64c8ba22 !important;
              } .bubble-icon { color: #64c8ba !important; } .bubble-name { font-weight: 700; } .bubble-button-card-container,
              .bubble-separator, .bubble-header { direction: rtl; } .bubble-name-container, .bubble-name, .bubble-state
              { text-align: right; direction: rtl; unicode-bidi: plaintext; } .bubble-name { white-space: normal;
              }" : ".bubble-button-background { opacity: 1 !important; background: #64c8ba22 !important; } .bubble-icon
              { color: #64c8ba !important; } .bubble-name { font-weight: 700; } .bubble-button-card-container, .bubble-separator,
              .bubble-header { direction: ltr; } .bubble-name-container, .bubble-name, .bubble-state { text-align:
              left; direction: ltr; unicode-bidi: plaintext; } .bubble-name { white-space: normal; }"}'
            tap_action:
              action: call-service
              service: input_boolean.turn_off
              service_data:
                entity_id: input_boolean.ps4_manual_block
            button_action:
              tap_action:
                action: call-service
                service: input_boolean.turn_off
                service_data:
                  entity_id: input_boolean.ps4_manual_block
        - type: horizontal-stack
          cards:
          - type: custom:bubble-card
            card_type: button
            button_type: state
            name: '${vars[0] ? "זמינות ⁦PS4⁩" : "PS4 availability"}'
            icon: mdi:sony-playstation
            card_layout: large
            styles: '${vars[0] ? ".bubble-button-background { opacity: 1 !important; background: #64c8ba22 !important;
              } .bubble-icon { color: #64c8ba !important; } .bubble-name { font-weight: 700; } .bubble-button-card-container,
              .bubble-separator, .bubble-header { direction: rtl; } .bubble-name-container, .bubble-name, .bubble-state
              { text-align: right; direction: rtl; unicode-bidi: plaintext; } .bubble-name { white-space: normal;
              }" : ".bubble-button-background { opacity: 1 !important; background: #64c8ba22 !important; } .bubble-icon
              { color: #64c8ba !important; } .bubble-name { font-weight: 700; } .bubble-button-card-container, .bubble-separator,
              .bubble-header { direction: ltr; } .bubble-name-container, .bubble-name, .bubble-state { text-align:
              left; direction: ltr; unicode-bidi: plaintext; } .bubble-name { white-space: normal; }"}'
            tap_action:
              action: more-info
            button_action:
              tap_action:
                action: more-info
            entity: sensor.ps4_ftp_status
            show_state: true
          - type: custom:bubble-card
            card_type: button
            button_type: state
            name: '${vars[0] ? "זמן היום" : "Time today"}'
            icon: mdi:timer-outline
            card_layout: large
            styles: '${vars[0] ? ".bubble-button-background { opacity: 1 !important; background: #aa9cfa22 !important;
              } .bubble-icon { color: #aa9cfa !important; } .bubble-name { font-weight: 700; } .bubble-button-card-container,
              .bubble-separator, .bubble-header { direction: rtl; } .bubble-name-container, .bubble-name, .bubble-state
              { text-align: right; direction: rtl; unicode-bidi: plaintext; } .bubble-name { white-space: normal;
              }" : ".bubble-button-background { opacity: 1 !important; background: #aa9cfa22 !important; } .bubble-icon
              { color: #aa9cfa !important; } .bubble-name { font-weight: 700; } .bubble-button-card-container, .bubble-separator,
              .bubble-header { direction: ltr; } .bubble-name-container, .bubble-name, .bubble-state { text-align:
              left; direction: ltr; unicode-bidi: plaintext; } .bubble-name { white-space: normal; }"}'
            tap_action:
              action: more-info
            button_action:
              tap_action:
                action: more-info
            entity: sensor.ps4_play_time_today
            show_state: true
        - type: custom:bubble-card
          card_type: button
          button_type: switch
          name: '${vars[0] ? "אכיפת שעות ומכסה" : "Schedule & quota enforcement"}'
          icon: mdi:shield-check-outline
          card_layout: large
          styles: '${vars[0] ? ".bubble-button-background { opacity: 1 !important; background: #64c8ba22 !important;
            } .bubble-icon { color: #64c8ba !important; } .bubble-name { font-weight: 700; } .bubble-button-card-container,
            .bubble-separator, .bubble-header { direction: rtl; } .bubble-name-container, .bubble-name, .bubble-state
            { text-align: right; direction: rtl; unicode-bidi: plaintext; } .bubble-name { white-space: normal;
            }" : ".bubble-button-background { opacity: 1 !important; background: #64c8ba22 !important; } .bubble-icon
            { color: #64c8ba !important; } .bubble-name { font-weight: 700; } .bubble-button-card-container, .bubble-separator,
            .bubble-header { direction: ltr; } .bubble-name-container, .bubble-name, .bubble-state { text-align:
            left; direction: ltr; unicode-bidi: plaintext; } .bubble-name { white-space: normal; }"}'
          tap_action:
            action: toggle
          button_action:
            tap_action:
              action: toggle
          entity: automation.ps4_playtime_enforcement
          show_state: true
        - type: custom:bubble-card
          card_type: separator
          name: '${vars[0] ? "הרגלי משחק" : "Playtime history"}'
          icon: mdi:chart-bar
          styles: '${vars[0] ? " .bubble-button-card-container, .bubble-separator, .bubble-header { direction: rtl;
            } .bubble-name-container, .bubble-name, .bubble-state { text-align: right; direction: rtl; unicode-bidi:
            plaintext; } .bubble-name { white-space: normal; }" : " .bubble-button-card-container, .bubble-separator,
            .bubble-header { direction: ltr; } .bubble-name-container, .bubble-name, .bubble-state { text-align:
