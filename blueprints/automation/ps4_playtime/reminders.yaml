conditions:
- alias: כריזה מופעלת ובשעות המותרות בלבד
  condition: template
  value_template: '{# הגנת שעות שקט: תקפה גם בהפעלה ידנית. טווח זה אינו חוצה חצות. #}

    {% set start = states(voice_start) %}

    {% set end = states(voice_end) %}

    {{ is_state(voice_enabled,''on'') and start not in [''unknown'',''unavailable''] and end not in [''unknown'',''unavailable'']
    and start < end and today_at(start) <= now() < today_at(end) }}'
- alias: הקונסולה עדיין פעילה
  condition: state
  entity_id: !input 'online_sensor'
  state: online
- alias: ההתראה עדיין מתאימה לזמן שנותר
  condition: template
  value_template: '{# בחירת הגדרות היום: שישי, שבת או א׳–ה׳. הערכים נערכים בלוח PS4. #}

    {% set profile = ''friday'' if now().weekday() == 4 else ''saturday'' if now().weekday() == 5 else ''weekday''
    %}

    {% set start_value = states({''weekday'': weekday_start, ''friday'': friday_start, ''saturday'': saturday_start}[profile])
    %}

    {% set end_value = states({''weekday'': weekday_end, ''friday'': friday_end, ''saturday'': saturday_end}[profile])
    %}

    {% set hours = states({''weekday'': weekday_hours, ''friday'': friday_hours, ''saturday'': saturday_hours}[profile])
    | float(0) %}

    {# תוספת תקפה ליום המקומי בלבד; אינה דוחה את שעת הסיום. #}

    {% set bonus = states(bonus_minutes) | float(0) if states(bonus_date) == now().date() | string else 0 %}

    {% set hours = hours + bonus / 60 %}

    {% set end_enabled = profile != ''friday'' or is_state(friday_end_enabled,''on'') %}

    {% set valid = start_value not in [''unknown'',''unavailable''] and end_value not in [''unknown'',''unavailable'']
    and hours > 0 %}

    {% set start = today_at(start_value) if valid else today_at(''00:00'') %}

    {% set end = today_at(end_value) if valid else today_at(''00:00'') %}

    {# טווח חוצה חצות אינו נתמך; ביום שישי ניתן לבטל שעת סיום. #}

    {% set valid = valid and (not end_enabled or end > start) %}

    {% set allowed = valid and now() >= start and (not end_enabled or now() < end) %}

    {% set used = states(daily_sensor) | float(0) %}

    {% set quota = hours * 60 - used * 60 %}

    {% set remaining = [quota, (end-now()).total_seconds()/60] | min if end_enabled else quota %}

    {{ allowed and trigger is defined and trigger.id in [''early'',''soon'',''final''] and remaining > 0 and remaining
    > (states({''early'': warning_early, ''soon'': warning_soon, ''final'': warning_final}[trigger.id]) | float(0)
    - 2) }}'
- condition: state
  entity_id: !input 'manual_block'
  state: 'off'
  alias: Skip reminders during a manual block
actions:
- alias: ניסוח לפי מספר הדקות שנבחר בלוח
  variables:
    minutes: '{{ states({''early'': warning_early, ''soon'': warning_soon, ''final'': warning_final}[trigger.id])
      | int }}'
- variables:
    message: נותרו בערך {{ minutes }} דקות לזמן המשחק בפלייסטיישן. אנא שמרו את המשחק והעבירו למצב מנוחה באמצעות
      השלט.
- alias: כריזה מופעלת ובשעות המותרות בלבד
  condition: template
  value_template: '{# הגנת שעות שקט: תקפה גם בהפעלה ידנית. טווח זה אינו חוצה חצות. #}

    {% set start = states(voice_start) %}

    {% set end = states(voice_end) %}

    {{ is_state(voice_enabled,''on'') and start not in [''unknown'',''unavailable''] and end not in [''unknown'',''unavailable'']
    and start < end and today_at(start) <= now() < today_at(end) }}'
- choose:
  - conditions: []
    sequence: !input 'announcement_actions'
mode: single
variables: &id001
  weekday_start: !input 'weekday_start'
  weekday_end: !input 'weekday_end'
  weekday_hours: !input 'weekday_hours'
  friday_start: !input 'friday_start'
  friday_end: !input 'friday_end'
  friday_hours: !input 'friday_hours'
  saturday_start: !input 'saturday_start'
  saturday_end: !input 'saturday_end'
  saturday_hours: !input 'saturday_hours'
  voice_start: !input 'voice_start'
  voice_end: !input 'voice_end'
  warning_early: !input 'warning_early'
  warning_soon: !input 'warning_soon'
  warning_final: !input 'warning_final'
  friday_end_enabled: !input 'friday_end_enabled'
  voice_enabled: !input 'voice_enabled'
  bonus_minutes: !input 'bonus_minutes'
  bonus_date: !input 'bonus_date'
  manual_block: !input 'manual_block'
  online_sensor: !input 'online_sensor'
  daily_sensor: !input 'daily_sensor'
trigger_variables: *id001
blueprint:
  name: PS4 Playtime Companion · Spoken reminders
  description: Three reminders before the earlier of quota expiry or closing time. Quiet hours checked at entry
    and immediately before the announcement. The action receives message and minutes variables. Late starts may
    miss a threshold.
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    weekday_start:
      name: Weekday Start
      default: input_datetime.ps4_weekday_start
      selector:
        entity:
          domain: input_datetime
    weekday_end:
      name: Weekday End
      default: input_datetime.ps4_weekday_end
      selector:
        entity:
          domain: input_datetime
    weekday_hours:
      name: Weekday Hours
      default: input_number.ps4_weekday_hours
      selector:
        entity:
          domain: input_number
    friday_start:
      name: Friday Start
      default: input_datetime.ps4_friday_start
      selector:
        entity:
          domain: input_datetime
    friday_end:
      name: Friday End
      default: input_datetime.ps4_friday_end
      selector:
        entity:
          domain: input_datetime
    friday_hours:
      name: Friday Hours
      default: input_number.ps4_friday_hours
      selector:
        entity:
          domain: input_number
    saturday_start:
      name: Saturday Start
      default: input_datetime.ps4_saturday_start
      selector:
        entity:
          domain: input_datetime
    saturday_end:
      name: Saturday End
      default: input_datetime.ps4_saturday_end
      selector:
        entity:
          domain: input_datetime
    saturday_hours:
      name: Saturday Hours
      default: input_number.ps4_saturday_hours
      selector:
        entity:
          domain: input_number
    voice_start:
      name: Voice Start
      default: input_datetime.ps4_voice_start
      selector:
        entity:
          domain: input_datetime
    voice_end:
      name: Voice End
      default: input_datetime.ps4_voice_end
      selector:
        entity:
          domain: input_datetime
    warning_early:
      name: Warning Early
      default: input_number.ps4_warning_early
      selector:
        entity:
          domain: input_number
    warning_soon:
      name: Warning Soon
      default: input_number.ps4_warning_soon
      selector:
        entity:
          domain: input_number
    warning_final:
      name: Warning Final
      default: input_number.ps4_warning_final
      selector:
        entity:
          domain: input_number
    friday_end_enabled:
      name: Friday End Enabled
      default: input_boolean.ps4_friday_end_enabled
      selector:
        entity:
          domain: input_boolean
    voice_enabled:
      name: Voice Enabled
      default: input_boolean.ps4_voice_enabled
      selector:
        entity:
          domain: input_boolean
    bonus_minutes:
      name: Bonus Minutes
      default: input_number.ps4_bonus_minutes
      selector:
        entity:
          domain: input_number
    bonus_date:
      name: Bonus Date
      default: input_datetime.ps4_bonus_date
      selector:
        entity:
          domain: input_datetime
    manual_block:
      name: Manual Block
      default: input_boolean.ps4_manual_block
      selector:
        entity:
          domain: input_boolean
    online_sensor:
      name: PS4 availability sensor
      description: Must report online while the console is active. FTP is a proxy, not proof of Rest Mode.
      selector:
        entity:
          domain: sensor
    daily_sensor:
      name: Daily active hours
      default: sensor.ps4_play_time_today
      selector:
        entity:
          domain: sensor
    announcement_actions:
      name: Announcement action
      description: 'For example tts.speak with message: "{{ message }}". Do not insert delays before playback; delayed/custom
        scripts must recheck quiet hours themselves.'
      selector:
        action: {}
